# WhatsApp -- SumiNami web-app definition.
#
# Web apps are Firefox instances with their own profile and window class, given
# a tray icon and a launcher so they behave like installed applications. See
# webapps/README.md for the field reference.

name = WhatsApp
class = whatsapp
url = https://web.whatsapp.com/
icon = whatsapp
color = #25D366

# Keybind that jumps to this app, generated only when it is installed -- a
# declined web app must not leave a dead key bound. Hyprland bind syntax,
# without the dispatcher.
key = SUPER SHIFT, W

# Unread count is read from the window title, which WhatsApp Web rewrites to
# "(3) WhatsApp" while messages are pending. Capture group 1 is the count.
unread_pattern = ^\((\d+)\)

# Hide the tab strip and navigation toolbar so the window reads as an app
# rather than a browser. Comment out to keep normal Firefox chrome.
app_chrome = true
