# Snapchat -- SumiNami web-app definition.
#
# Snapchat Web refuses to load in Firefox, showing "only supports the latest
# version of Chrome, Edge, and Safari". That is a browser allow-list, not a
# capability check, so the profile presents a Chrome user agent to
# snapchat.com only. Nothing else in the profile or in normal browsing is
# affected.

name = Snapchat
class = snapchat
url = https://web.snapchat.com/
icon = snapchat
color = #FFFC00

user_agent = Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/137.0.0.0 Safari/537.36

# Snapchat Web does not put an unread count in the window title, so no
# unread_pattern -- the tray icon shows no badge. Desktop notifications still
# work, since those come from the page rather than the title.

app_chrome = true

# Snapchat hides its web login in a narrow window and offers only an app
# download. Zooming out widens the CSS viewport enough to get the real
# interface while the window stays tiled at half a screen.
zoom = 33

# Granted up front rather than prompted for: app_chrome hides the navigation
# toolbar, and Firefox anchors permission prompts to it, so a prompt would dim
# the page and then never appear.
permissions = notifications:allow, camera:allow, microphone:allow, geolocation:deny
