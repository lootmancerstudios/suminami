# SumiNami -- transition bridge. This is NOT the config; edit the .lua files.
#
# SumiNami's Hyprland config is Lua now (hyprland.lua and the modules it
# requires). Hyprland reads that at startup and never opens this file.
#
# The one thing that still reads it is a Hyprland 0.55/0.56 session that was
# already running on the old .conf format when the update arrived. Such a
# session reloads this path, and if it found nothing here it would drop every
# keybind on the spot -- leaving no way to log out short of a TTY. This file is
# a frozen copy of the last .conf config, so that session carries on working
# until you log out. From the next login onwards Hyprland uses hyprland.lua.
#
# Frozen: do not update it alongside the Lua config. It can be deleted once
# nobody is upgrading from a .conf install.

# Tell the user what is going on. Hyprland's own notification, so it survives
# the notification daemon being restarted by the updater.
exec = hyprctl dismissnotify; hyprctl notify 1 60000 "rgb(ff9e3b)" "fontsize:14 SumiNami was updated. Log out and back in to finish (Super+Escape)."

# Per-machine files from the old layout, if they are still around.
source = ~/.config/hypr/monitors.conf

# ---- env.conf ----
# Set programs that you use
$terminal = kitty
$fileManager = thunar
$menu = ~/.config/waybar/scripts/launcher
$browser = firefox

# Environment variables
env = XCURSOR_SIZE,24
env = HYPRCURSOR_SIZE,24


# ---- input.conf ----
# https://wiki.hypr.land/Configuring/Variables/#input
input {
    kb_layout = us
    kb_variant =
    kb_model =
    kb_options =
    kb_rules =

    follow_mouse = 1

    sensitivity = 0 # -1.0 - 1.0, 0 means no modification.

    touchpad {
        natural_scroll = false
        clickfinger_behavior = true
    }
}

# See https://wiki.hypr.land/Configuring/Gestures
gesture = 3, horizontal, workspace

# Example per-device config
# See https://wiki.hypr.land/Configuring/Keywords/#per-device-input-configs for more
device {
    name = epic-mouse-v1
    sensitivity = -0.5
}

# ---- visuals.conf ----
# Refer to https://wiki.hypr.land/Configuring/Variables/

# https://wiki.hypr.land/Configuring/Variables/#general
general {
    gaps_in = 5
    gaps_out = 10

    border_size = 2

    # https://wiki.hypr.land/Configuring/Variables/#variable-types for info about colors
    col.active_border = rgba(ddddddff) rgba(aeaeaeff) 45deg
    col.inactive_border = rgba(333333aa)

    # Set to true enable resizing windows by clicking and dragging on borders and gaps
    resize_on_border = false

    # Please see https://wiki.hypr.land/Configuring/Tearing/ before you turn this on
    allow_tearing = false

    layout = dwindle
}

# https://wiki.hypr.land/Configuring/Variables/#decoration
decoration {
    rounding = 0
    rounding_power = 2

    # Change transparency of focused and unfocused windows
    active_opacity = 0.96
    inactive_opacity = 0.93

    shadow {
        enabled = true
        range = 4
        render_power = 3
        color = rgba(1a1a1aee)
    }

    # https://wiki.hypr.land/Configuring/Variables/#blur
    blur {
        enabled = true
        size = 3
        passes = 1

        vibrancy = 0.1696
    }
}

# https://wiki.hypr.land/Configuring/Variables/#animations
animations {
    enabled = yes, please :)

    # Default curves, see https://wiki.hypr.land/Configuring/Animations/#curves
    #        NAME,           X0,   Y0,   X1,   Y1
    bezier = easeOutQuint,   0.23, 1,    0.32, 1
    bezier = easeInOutCubic, 0.65, 0.05, 0.36, 1
    bezier = linear,         0,    0,    1,    1
    bezier = almostLinear,   0.5,  0.5,  0.75, 1
    bezier = quick,          0.15, 0,    0.1,  1

    # Default animations, see https://wiki.hypr.land/Configuring/Animations/
    #           NAME,          ONOFF, SPEED, CURVE,        [STYLE]
    animation = global,        1,     10,    default
    animation = border,        1,     5.39,  easeOutQuint
    animation = windows,       1,     4.79,  easeOutQuint
    animation = windowsIn,     1,     4.1,   easeOutQuint, popin 87%
    animation = windowsOut,    1,     1.49,  linear,       popin 87%
    animation = fadeIn,        1,     1.73,  almostLinear
    animation = fadeOut,       1,     1.46,  almostLinear
    animation = fade,          1,     3.03,  quick
    animation = layers,        1,     3.81,  easeOutQuint
    animation = layersIn,      1,     4,     easeOutQuint, fade
    animation = layersOut,     1,     1.5,   linear,       fade
    animation = fadeLayersIn,  1,     1.79,  almostLinear
    animation = fadeLayersOut, 1,     1.39,  almostLinear
    animation = workspaces,    1,     1.94,  almostLinear, fade
    animation = workspacesIn,  1,     1.21,  almostLinear, fade
    animation = workspacesOut, 1,     1.94,  almostLinear, fade
    animation = zoomFactor,    1,     7,     quick
}

# https://wiki.hypr.land/Configuring/Variables/#misc
misc {
    force_default_wallpaper = 0 # Disable the anime mascot wallpapers
    disable_hyprland_logo = true # Disable the random hyprland logo / anime girl background
    disable_splash_rendering = true # Disable the random splash text at the bottom
}

# ---- layout.conf ----
# Ref https://wiki.hypr.land/Configuring/Workspace-Rules/
# "Smart gaps" / "No gaps when only"
# uncomment all if you wish to use that.
# workspace = w[tv1], gapsout:0, gapsin:0
# workspace = f[1], gapsout:0, gapsin:0
# windowrule = bordersize 0, floating:0, onworkspace:w[tv1]
# windowrule = rounding 0, floating:0, onworkspace:w[tv1]
# windowrule = bordersize 0, floating:0, onworkspace:f[1]
# windowrule = rounding 0, floating:0, onworkspace:f[1]

# See https://wiki.hypr.land/Configuring/Layouts/Dwindle-Layout/ for more
dwindle {
    # Pseudotiling is toggled per-window with the 'pseudo' dispatcher (Super+P,
    # see keybinds.conf). The old dwindle:pseudotile option was a no-op and was
    # removed in Hyprland 0.55, so it must not be set here.
    preserve_split = true # You probably want this
}

# See https://wiki.hypr.land/Configuring/Master-Layout/ for more
master {
    new_status = master
}

# ---- keybinds.conf ----
# See https://wiki.hypr.land/Configuring/Keywords/
$mainMod = SUPER # Sets "Windows" key as main modifier

# Example binds, see https://wiki.hypr.land/Configuring/Binds/ for more
# Plain close. smart-close now speaks the Lua dispatch syntax, which a session
# still on the old format rejects.
bind = $mainMod, Q, killactive,
bind = $mainMod, F, exec, $fileManager
bind = $mainMod, V, togglefloating,
bind = $mainMod, A, exec, $menu
bind = $mainMod, W, fullscreen, 0
bind = $mainMod, P, pseudo, # dwindle
bind = $mainMod, J, layoutmsg, togglesplit # dwindle: toggle split orientation (matches Omarchy)
bind = $mainMod, B, exec, firefox
bind = $mainMod SHIFT, B, exec, firefox --private-window
bind = $mainMod, RETURN, exec, kitty

# Power menu and lock
bind = $mainMod, ESCAPE, exec, ~/.config/suminami/scripts/hub/system.sh
bind = $mainMod, L, exec, hyprlock

# Color picker (copies hex to clipboard)
bind = $mainMod, I, exec, hyprpicker -a

# Night light toggle (gammastep)
bind = $mainMod, N, exec, ~/.config/suminami/scripts/night-light

# Screenshots (hyprshot)
bind = , Print, exec, hyprshot -m output -o ~/Pictures
bind = SHIFT, Print, exec, hyprshot -m region -o ~/Pictures
bind = $mainMod, Print, exec, hyprshot -m window -o ~/Pictures
bind = $mainMod, S, exec, hyprshot -m window -o ~/Pictures
bind = $mainMod SHIFT, S, exec, hyprshot -m region -o ~/Pictures

# Screen recording (wf-recorder with GPU auto-detection)
bind = $mainMod, R, exec, ~/.config/suminami/scripts/screen-record
bind = $mainMod SHIFT, R, exec, ~/.config/suminami/scripts/screen-record region

# Move focus with mainMod + arrow keys
bind = $mainMod, left, movefocus, l
bind = $mainMod, right, movefocus, r
bind = $mainMod, up, movefocus, u
bind = $mainMod, down, movefocus, d

# Resize active window with Super + Shift + arrow keys
bind = $mainMod SHIFT, left, resizeactive, -20 0
bind = $mainMod SHIFT, right, resizeactive, 20 0
bind = $mainMod SHIFT, up, resizeactive, 0 -20
bind = $mainMod SHIFT, down, resizeactive, 0 20

# Move active window with Super + Alt + arrow keys
bind = $mainMod ALT, left, movewindow, l
bind = $mainMod ALT, right, movewindow, r
bind = $mainMod ALT, up, movewindow, u
bind = $mainMod ALT, down, movewindow, d

# Switch workspaces with mainMod + [0-9]
bind = $mainMod, 1, workspace, 1
bind = $mainMod, 2, workspace, 2
bind = $mainMod, 3, workspace, 3
bind = $mainMod, 4, workspace, 4
bind = $mainMod, 5, workspace, 5
bind = $mainMod, 6, workspace, 6
bind = $mainMod, 7, workspace, 7
bind = $mainMod, 8, workspace, 8
bind = $mainMod, 9, workspace, 9
bind = $mainMod, 0, workspace, 10

# Move active window to a workspace with mainMod + SHIFT + [0-9]
bind = $mainMod SHIFT, 1, movetoworkspace, 1
bind = $mainMod SHIFT, 2, movetoworkspace, 2
bind = $mainMod SHIFT, 3, movetoworkspace, 3
bind = $mainMod SHIFT, 4, movetoworkspace, 4
bind = $mainMod SHIFT, 5, movetoworkspace, 5
bind = $mainMod SHIFT, 6, movetoworkspace, 6
bind = $mainMod SHIFT, 7, movetoworkspace, 7
bind = $mainMod SHIFT, 8, movetoworkspace, 8
bind = $mainMod SHIFT, 9, movetoworkspace, 9
bind = $mainMod SHIFT, 0, movetoworkspace, 10


# Scroll through existing workspaces with mainMod + scroll
bind = $mainMod, mouse_down, workspace, e+1
bind = $mainMod, mouse_up, workspace, e-1

# Navigate workspaces with Ctrl + Super + arrow keys
bind = CTRL $mainMod, left, workspace, -1
bind = CTRL $mainMod, right, workspace, +1

# Move active window to prev/next workspace with Ctrl + Alt + Super + arrow keys
bind = CTRL ALT $mainMod, left, movetoworkspace, -1
bind = CTRL ALT $mainMod, right, movetoworkspace, +1

# Move/resize windows with mainMod + LMB/RMB and dragging
bindm = $mainMod, mouse:272, movewindow
bindm = $mainMod, mouse:273, resizewindow

# Laptop multimedia keys for volume and LCD brightness
bindel = ,XF86AudioRaiseVolume, exec, pactl set-sink-volume @DEFAULT_SINK@ +5%
bindel = ,XF86AudioLowerVolume, exec, pactl set-sink-volume @DEFAULT_SINK@ -5%
bindel = ,XF86AudioMute, exec, pactl set-sink-mute @DEFAULT_SINK@ toggle
bindel = ,XF86AudioMicMute, exec, pactl set-source-mute @DEFAULT_SOURCE@ toggle
bindel = ,XF86MonBrightnessUp, exec, brightnessctl -n2 set 10%+
bindel = ,XF86MonBrightnessDown, exec, brightnessctl -n2 set 10%-

# Keyboard backlight
bindel = ,XF86KbdBrightnessUp, exec, brightnessctl -d smc::kbd_backlight set 10%+
bindel = ,XF86KbdBrightnessDown, exec, brightnessctl -d smc::kbd_backlight set 10%-

# Requires playerctl
bindl = , XF86AudioNext, exec, playerctl next
bindl = , XF86AudioPause, exec, playerctl play-pause
bindl = , XF86AudioPlay, exec, playerctl play-pause
bindl = , XF86AudioPrev, exec, playerctl previous

# ---- rules.conf ----
# See https://wiki.hypr.land/Configuring/Window-Rules/ for more
# See https://wiki.hypr.land/Configuring/Workspace-Rules/ for workspace rules

# Example windowrule
# windowrule = float,class:^(kitty)$,title:^(kitty)$

# Kitty opacity changes
# windowrulev2 = opacity 0.91,class:^(kitty)$
# windowrulev2 = opacity 0.94,class:^(kitty)$,focus:1

# Firefox opacity changes (same as kitty)
# windowrulev2 = opacity 0.91,class:^(firefox)$
# windowrulev2 = opacity 0.94,class:^(firefox)$,focus:1

# Ignore maximize requests from apps. You'll probably like this.
windowrule {
    name = suppress-maximize-events
    match:class = .*
    suppress_event = maximize
}

# Fix some dragging issues with XWayland
windowrule {
    name = fix-xwayland-drags
    match:class = ^$
    match:title = ^$
    match:xwayland = true
    match:float = true
    match:fullscreen = false
    match:pin = false
    no_focus = true
}

# Machine-specific overrides from the old layout, last so they win.
source = ~/.config/hypr/local.conf
